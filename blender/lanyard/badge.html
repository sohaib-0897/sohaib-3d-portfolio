<!doctype html>
<!-- Career badge artwork for the `career_badge` mesh. Render with: node render_badge.cjs → badge.png (600×900).
     Generic typography + abstract accent only: no employer logo, no company affiliation. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .card {
    position: relative;
    width: 600px; height: 900px;
    box-sizing: border-box;
    background:
      radial-gradient(120% 70% at 85% 0%, rgba(111, 144, 111, 0.16), rgba(0, 0, 0, 0) 60%),
      linear-gradient(180deg, #1b1f25 0%, #14171c 100%);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color: #f4f1ea;
    overflow: hidden;
  }
  /* lanyard slot punched near the top */
  .slot {
    position: absolute; left: 50%; top: 42px; transform: translateX(-50%);
    width: 118px; height: 26px; border-radius: 13px;
    background: #07080a;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  /* abstract accent: a thin orbit + node, top right */
  .orbit { position: absolute; right: -70px; top: 90px; width: 300px; height: 300px; }
  .mark {
    position: absolute; left: 56px; top: 132px;
    width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid rgba(255, 217, 179, 0.85);
    display: grid; place-items: center;
    font-weight: 700; font-size: 25px; letter-spacing: 0.04em; color: #ffd9b3;
  }
  .over {
    position: absolute; left: 56px; top: 232px;
    font-size: 21px; font-weight: 600; letter-spacing: 0.34em; color: rgba(244, 241, 234, 0.5);
  }
  .name {
    position: absolute; left: 52px; top: 250px; right: 40px;
    font-size: 104px; line-height: 0.98; font-weight: 800; letter-spacing: 0.01em;
  }
  .rule { position: absolute; left: 56px; top: 500px; width: 96px; height: 5px; border-radius: 3px; background: #ffd9b3; }
  .role {
    position: absolute; left: 56px; top: 532px; right: 50px;
    font-size: 37px; line-height: 1.25; font-weight: 500; color: rgba(244, 241, 234, 0.86);
  }
  .band {
    position: absolute; left: 0; right: 0; bottom: 0; height: 150px;
    background: #ffd9b3; color: #15181d;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    font-size: 31px; font-weight: 800; letter-spacing: 0.12em;
  }
  .band::before {
    content: ''; flex: none; width: 14px; height: 14px;
    border-radius: 50%; background: #2f7d5b;
  }
  .edge { position: absolute; inset: 0; border: 4px solid rgba(244, 241, 234, 0.1); pointer-events: none; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="slot"></div>
    <svg class="orbit" viewBox="0 0 300 300" aria-hidden="true">
      <circle cx="150" cy="150" r="120" fill="none" stroke="rgba(244,241,234,0.10)" stroke-width="2" />
      <circle cx="150" cy="150" r="78" fill="none" stroke="rgba(244,241,234,0.07)" stroke-width="2" />
      <circle cx="46" cy="210" r="7" fill="#ffd9b3" opacity="0.9" />
      <circle cx="228" cy="96" r="4" fill="rgba(244,241,234,0.45)" />
    </svg>
    <div class="mark">SI</div>
    <div class="name">SOHAIB<br />IMRAN</div>
    <div class="rule"></div>
    <div class="role">Backend / Applied AI<br />Engineer</div>
    <div class="band">OPEN TO OPPORTUNITIES</div>
    <div class="edge"></div>
  </div>
</body>
</html>
