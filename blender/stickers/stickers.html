<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Sohaib sticker atlas (2048x2048, 4x4 cells of 512px). Rendered to PNG by render_atlas.cjs.
     All artwork is original: generic icons + text, no official product logos. -->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #atlas { position: relative; width: 2048px; height: 2048px; }
  .cell { position: absolute; width: 512px; height: 512px; display: flex; align-items: center; justify-content: center; }
  svg { display: block; overflow: visible; }
  .bahn { font-family: 'Bahnschrift', 'Segoe UI', sans-serif; }
  .mono { font-family: 'Cascadia Mono', 'Consolas', monospace; }
</style>
</head>
<body>
<div id="atlas"></div>
<script>
// palette
const INK = '#14171c', PAPER = '#f4f1ea', W = '#ffffff'
const DIE = 22 // die-cut white border width (px in the 512 cell)

// Each sticker: [id, width, height, svg-inner]. Coordinates are in px of the sticker's own box.
const S = []

// 1 DataShield — shield die-cut, lock + data dots, name on the lower band
S.push(['datashield', 360, 420, `
  <path id="sh" d="M180 18 L330 70 L330 200 C330 300 262 368 180 402 C98 368 30 300 30 200 L30 70 Z"
        fill="${W}" stroke="${W}" stroke-width="${DIE * 2}" stroke-linejoin="round"/>
  <path d="M180 18 L330 70 L330 200 C330 300 262 368 180 402 C98 368 30 300 30 200 L30 70 Z" fill="#0f2622"/>
  <path d="M180 44 L306 88 L306 200 C306 286 250 344 180 374 C110 344 54 286 54 200 L54 88 Z" fill="none" stroke="#2fd3a3" stroke-width="7"/>
  <rect x="128" y="150" width="104" height="84" rx="14" fill="#2fd3a3"/>
  <path d="M146 150 V126 a34 34 0 0 1 68 0 V150" fill="none" stroke="#2fd3a3" stroke-width="14" stroke-linecap="round"/>
  <circle cx="180" cy="184" r="11" fill="#0f2622"/><rect x="175" y="188" width="10" height="24" rx="4" fill="#0f2622"/>
  <g fill="#2fd3a3" opacity=".55">${[0,1,2,3,4,5].map(i => `<rect x="${92 + i * 30}" y="258" width="16" height="6" rx="3"/>`).join('')}</g>
  <text x="180" y="316" text-anchor="middle" class="bahn" font-weight="700" font-size="38" fill="${PAPER}">DataShield</text>
`])

// 2 OmniOps — round, two cycle arrows around a gear
const gear = (cx, cy, r, n, fill) => {
  let d = ''
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2
    const w = Math.PI / n * 0.55
    const p = (ang, rr) => `${(cx + Math.cos(ang) * rr).toFixed(1)} ${(cy + Math.sin(ang) * rr).toFixed(1)}`
    d += `${i ? 'L' : 'M'}${p(a - w * 1.4, r)} L${p(a - w, r + r * 0.28)} L${p(a + w, r + r * 0.28)} L${p(a + w * 1.4, r)} `
  }
  return `<path d="${d}Z" fill="${fill}"/><circle cx="${cx}" cy="${cy}" r="${r * 0.42}" fill="#1b1916"/>`
}
S.push(['omniops', 400, 400, `
  <circle cx="200" cy="200" r="190" fill="${W}"/>
  <circle cx="200" cy="200" r="170" fill="#1b1916"/>
  <path d="M72 200 A128 128 0 0 1 296 116" fill="none" stroke="#ff8a3d" stroke-width="16" stroke-linecap="round"/>
  <path d="M300 118 l-2 -40 l-34 26 z" fill="#ff8a3d"/>
  <path d="M328 200 A128 128 0 0 1 104 284" fill="none" stroke="#ff8a3d" stroke-width="16" stroke-linecap="round"/>
  <path d="M100 282 l2 40 l34 -26 z" fill="#ff8a3d"/>
  ${gear(200, 164, 40, 8, PAPER)}
  <text x="200" y="256" text-anchor="middle" class="bahn" font-weight="700" font-size="40" fill="${PAPER}">OmniOps</text>
`])

// 3 VigilAI — rounded badge, watchful scanner lens + name
S.push(['vigilai', 460, 280, `
  <rect x="0" y="0" width="460" height="280" rx="70" fill="${W}"/>
  <rect x="20" y="20" width="420" height="240" rx="54" fill="#101826"/>
  <path d="M40 140 Q120 52 200 140 Q120 228 40 140 Z" fill="none" stroke="#ffb020" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="120" cy="140" r="36" fill="#ffb020"/>
  <circle cx="120" cy="140" r="36" fill="none" stroke="#101826" stroke-width="5" stroke-dasharray="6 7"/>
  <circle cx="120" cy="140" r="12" fill="#101826"/>
  <path d="M120 96 V112 M120 168 V184 M76 140 H92 M148 140 H164" stroke="#ffb020" stroke-width="5" stroke-linecap="round"/>
  <text x="222" y="158" class="bahn" font-weight="700" font-size="62" fill="${PAPER}">Vigil<tspan fill="#ffb020">AI</tspan></text>
  <rect x="226" y="176" width="178" height="6" rx="3" fill="#ffb020" opacity=".45"/>
`])

// 4 InboxLearn — envelope die-cut with a spark, name on the envelope
S.push(['inboxlearn', 440, 320, `
  <rect x="0" y="20" width="440" height="300" rx="46" fill="${W}"/>
  <rect x="20" y="40" width="400" height="260" rx="32" fill="#12305a"/>
  <path d="M34 60 L220 186 L406 60" fill="none" stroke="#8cc4ff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="220" y="272" text-anchor="middle" class="bahn" font-weight="700" font-size="50" fill="${PAPER}">InboxLearn</text>
  <circle cx="392" cy="48" r="44" fill="${W}"/>
  <path d="M392 14 L402 38 L426 48 L402 58 L392 82 L382 58 L358 48 L382 38 Z" fill="#ffd166"/>
`])

// 5 agents — hexagon, orchestrator node + 4 agent nodes
const hex = (cx, cy, r) => Array.from({ length: 6 }, (_, i) => {
  const a = Math.PI / 6 + i * Math.PI / 3; return `${(cx + Math.cos(a) * r).toFixed(1)},${(cy + Math.sin(a) * r).toFixed(1)}`
}).join(' ')
S.push(['agents', 380, 400, `
  <polygon points="${hex(190, 200, 196)}" fill="${W}" stroke="${W}" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="${hex(190, 200, 172)}" fill="#1d1733" stroke-linejoin="round"/>
  <g stroke="#b69cff" stroke-width="7" stroke-linecap="round">
    <line x1="190" y1="170" x2="110" y2="110"/><line x1="190" y1="170" x2="270" y2="110"/>
    <line x1="190" y1="170" x2="110" y2="236"/><line x1="190" y1="170" x2="270" y2="236"/>
  </g>
  <circle cx="190" cy="170" r="30" fill="#b69cff"/>
  <g fill="${PAPER}"><circle cx="110" cy="110" r="18"/><circle cx="270" cy="110" r="18"/><circle cx="110" cy="236" r="18"/><circle cx="270" cy="236" r="18"/></g>
  <text x="190" y="306" text-anchor="middle" class="mono" font-weight="700" font-size="40" fill="#b69cff">agents</text>
`])

// 6 python — REPL prompt pill (no logo)
S.push(['python', 470, 190, `
  <rect x="0" y="0" width="470" height="190" rx="95" fill="${W}"/>
  <rect x="18" y="18" width="434" height="154" rx="77" fill="${INK}"/>
  <text x="235" y="113" text-anchor="middle" class="mono" font-weight="700" font-size="58"><tspan fill="#ffd43b">&gt;&gt;&gt;</tspan><tspan fill="#7fb2e5"> python</tspan></text>
`])

// 7 fastapi — code tag with a small bolt
S.push(['fastapi', 440, 250, `
  <rect x="0" y="0" width="440" height="250" rx="40" fill="${W}"/>
  <rect x="18" y="18" width="404" height="214" rx="28" fill="#0c2a28"/>
  <path d="M378 38 L346 100 L366 100 L350 150 L394 82 L372 82 L388 38 Z" fill="#27c4a8"/>
  <text x="44" y="108" class="mono" font-weight="700" font-size="46" fill="${PAPER}">async def</text>
  <text x="44" y="190" class="mono" font-weight="700" font-size="46" fill="#27c4a8">FastAPI</text>
`])

// 8 docker — stacked containers + compose
const box = (x, y, c) => `<rect x="${x}" y="${y}" width="56" height="44" rx="6" fill="${c}"/>` +
  [1, 2, 3].map(i => `<rect x="${x + i * 14 - 2}" y="${y + 8}" width="4" height="28" rx="2" fill="#0e2236" opacity=".45"/>`).join('')
S.push(['docker', 400, 360, `
  <rect x="0" y="0" width="400" height="360" rx="56" fill="${W}"/>
  <rect x="18" y="18" width="364" height="324" rx="42" fill="#0e2236"/>
  ${box(88, 150, '#3a9be8')}${box(152, 150, '#3a9be8')}${box(216, 150, '#3a9be8')}
  ${box(120, 98, '#6fb8f2')}${box(184, 98, '#6fb8f2')}
  ${box(152, 46, '#a9d6fa')}
  <path d="M70 212 H330" stroke="#3a9be8" stroke-width="6" stroke-linecap="round"/>
  <text x="200" y="290" text-anchor="middle" class="mono" font-weight="700" font-size="38" fill="${PAPER}">compose up</text>
`])

// 9 git — branch + merge graph
S.push(['git', 380, 380, `
  <circle cx="190" cy="190" r="186" fill="${W}"/>
  <circle cx="190" cy="190" r="164" fill="#1e1512"/>
  <path d="M110 70 V250" stroke="#f0643c" stroke-width="12" stroke-linecap="round"/>
  <path d="M110 110 C110 150 250 130 250 170 V190 C250 225 110 215 110 250" fill="none" stroke="#ffb199" stroke-width="10" stroke-linecap="round"/>
  <g fill="#f0643c"><circle cx="110" cy="70" r="16"/><circle cx="110" cy="160" r="16"/><circle cx="110" cy="250" r="18"/></g>
  <g fill="#ffb199"><circle cx="250" cy="170" r="15"/></g>
  <text x="190" y="316" text-anchor="middle" class="mono" font-weight="700" font-size="40" fill="${PAPER}">git push</text>
`])

// 10 postgres — database cylinder die-cut + SQL
S.push(['postgres', 320, 400, `
  <path d="M20 70 C20 20 300 20 300 70 V330 C300 380 20 380 20 330 Z" fill="${W}" stroke="${W}" stroke-width="36" stroke-linejoin="round"/>
  <path d="M20 70 C20 20 300 20 300 70 V330 C300 380 20 380 20 330 Z" fill="#2f5d8a"/>
  <ellipse cx="160" cy="70" rx="140" ry="40" fill="#5b8dbd"/>
  <path d="M20 150 C20 190 300 190 300 150 M20 240 C20 280 300 280 300 240" fill="none" stroke="#1d3f61" stroke-width="7"/>
  <text x="160" y="216" text-anchor="middle" class="mono" font-weight="700" font-size="44" fill="${PAPER}">SELECT *</text>
  <text x="160" y="316" text-anchor="middle" class="bahn" font-weight="700" font-size="40" fill="#cfe3f7">postgres</text>
`])

// 11 opencv — detection box + confidence tag
S.push(['opencv', 360, 360, `
  <rect x="0" y="0" width="360" height="360" rx="60" fill="${W}"/>
  <rect x="18" y="18" width="324" height="324" rx="46" fill="#141c14"/>
  <g stroke="#59e36b" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M78 118 V78 H118"/><path d="M242 78 H282 V118"/><path d="M282 222 V262 H242"/><path d="M118 262 H78 V222"/>
  </g>
  <circle cx="180" cy="170" r="30" fill="none" stroke="${PAPER}" stroke-width="8"/>
  <path d="M180 124 V146 M180 194 V216 M134 170 H156 M204 170 H226" stroke="${PAPER}" stroke-width="7" stroke-linecap="round"/>
  <rect x="78" y="282" width="120" height="40" rx="8" fill="#59e36b"/>
  <text x="138" y="312" text-anchor="middle" class="mono" font-weight="700" font-size="30" fill="#141c14">cv2</text>
  <text x="212" y="312" class="mono" font-size="28" fill="#59e36b">0.98</text>
`])

// 12 terminal — backend shell window
S.push(['terminal', 440, 300, `
  <rect x="0" y="0" width="440" height="300" rx="42" fill="${W}"/>
  <rect x="18" y="18" width="404" height="264" rx="28" fill="${INK}"/>
  <path d="M18 70 V46 a28 28 0 0 1 28 -28 H394 a28 28 0 0 1 28 28 V70 Z" fill="#2a2f38"/>
  <circle cx="54" cy="44" r="9" fill="#ff5f57"/><circle cx="84" cy="44" r="9" fill="#febc2e"/><circle cx="114" cy="44" r="9" fill="#28c840"/>
  <text x="44" y="146" class="mono" font-weight="700" font-size="40"><tspan fill="#28c840">$</tspan><tspan fill="${PAPER}"> uvicorn</tspan></text>
  <text x="44" y="220" class="mono" font-weight="700" font-size="40" fill="#28c840">200 OK<tspan fill="${PAPER}"> ▍</tspan></text>
`])

// 13 tennis — ball, no text
S.push(['tennis', 300, 300, `
  <circle cx="150" cy="150" r="146" fill="${W}"/>
  <circle cx="150" cy="150" r="126" fill="#cfe04a"/>
  <path d="M52 72 C112 112 112 188 52 228" fill="none" stroke="${W}" stroke-width="12" stroke-linecap="round"/>
  <path d="M248 72 C188 112 188 188 248 228" fill="none" stroke="${W}" stroke-width="12" stroke-linecap="round"/>
  <circle cx="150" cy="150" r="126" fill="none" stroke="#a9ba2c" stroke-width="4"/>
`])

// 14 metal — horns + bolt, black
S.push(['metal', 320, 320, `
  <circle cx="160" cy="160" r="156" fill="${W}"/>
  <circle cx="160" cy="160" r="136" fill="#0b0b0c"/>
  <circle cx="160" cy="160" r="118" fill="none" stroke="#3a3a3e" stroke-width="3"/>
  <text x="160" y="186" text-anchor="middle" class="bahn" font-weight="700" font-size="92" fill="${PAPER}" font-style="italic">\\m/</text>
  <path d="M146 212 L132 250 L154 244 L144 276 L180 232 L158 238 L170 212 Z" fill="#e0342b"/>
`])

// 15 coffee — mug + steam
S.push(['coffee', 320, 320, `
  <rect x="0" y="0" width="320" height="320" rx="80" fill="${W}"/>
  <rect x="18" y="18" width="284" height="284" rx="64" fill="#2b1d16"/>
  <path d="M84 132 H206 V214 a36 36 0 0 1 -36 36 H120 a36 36 0 0 1 -36 -36 Z" fill="${PAPER}"/>
  <path d="M206 150 h14 a26 26 0 0 1 0 52 h-14" fill="none" stroke="${PAPER}" stroke-width="12"/>
  <path d="M116 110 c-12 -16 12 -24 0 -44 M146 110 c-12 -16 12 -24 0 -44 M176 110 c-12 -16 12 -24 0 -44" fill="none" stroke="#c89b72" stroke-width="8" stroke-linecap="round"/>
  <rect x="98" y="160" width="94" height="10" rx="5" fill="#c89b72"/>
`])

// layout in 4x4 cells; each sticker scaled to fit 470px max side
const atlas = document.getElementById('atlas')
const boxes = {}
S.forEach(([id, w, h, inner], i) => {
  const cx = i % 4, cy = Math.floor(i / 4)
  const k = Math.min(470 / (w + 12), 470 / (h + 12))
  const cell = document.createElement('div'); cell.className = 'cell'
  cell.style.left = cx * 512 + 'px'; cell.style.top = cy * 512 + 'px'
  cell.innerHTML = `<svg id="${id}" width="${(w + 12) * k}" height="${(h + 12) * k}" viewBox="-6 -6 ${w + 12} ${h + 12}">${inner}</svg>`
  atlas.appendChild(cell)
})
requestAnimationFrame(() => {
  document.querySelectorAll('svg').forEach(s => {
    const r = s.getBoundingClientRect()
    boxes[s.id] = { x: r.left, y: r.top, w: r.width, h: r.height }
  })
  window.__boxes = boxes
})
</script>
</body>
</html>
